spring:
  application:
    name: kreadevis-backend
  datasource:
    url: ${DATASOURCE_URL:jdbc:postgresql://localhost:5432/app1db}
    username: ${DATASOURCE_USERNAME:app1user}
    password: ${DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB

server:
  port: ${SERVER_PORT:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

# --- App config ---
app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration-ms: 3600000
    refresh-token-expiration-ms: 86400000
  company:
    name: ${COMPANY_NAME:Your Company}
    address: ${COMPANY_ADDRESS:}
    phone: ${COMPANY_PHONE:}
    email: ${COMPANY_EMAIL:}
    siren: ${COMPANY_SIREN:}
  document:
    logo-path: ${DOC_LOGO_PATH:classpath:static/logo.png}
    output-dir: ${DOC_OUTPUT_DIR:/tmp/kreadevis/documents}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200}
  rate-limit:
    auth:
      capacity: 5
      window-seconds: 60
  email:
    enabled: ${EMAIL_ENABLED:true}
    mailjet:
      api-url: ${MAILJET_API_URL:https://api.mailjet.com/v3.1/send}
      api-key: ${MAILJET_API_KEY}
      api-secret: ${MAILJET_API_SECRET}
    sender:
      email: ${EMAIL_SENDER_ADDRESS:noreply@kreadevis.fr}
      name: ${EMAIL_SENDER_NAME:Kreadevis}
  csv:
    import:
      max-rows: 10000
      allowed-content-types:
        - text/csv
        - application/vnd.ms-excel
      columns:
        label: label
        description: description
        stock-quantity: stockQuantity
        unit-price: unitPrice
        vat-rate: vatRate
        reference-code: referenceCode

---
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
logging:
  level:
    com.slim: DEBUG

---
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false
logging:
  level:
    com.slim: INFO
